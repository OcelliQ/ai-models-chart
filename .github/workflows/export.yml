name: Export charts

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s . -p 'test_*.py'
      - run: uv run make_chart.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: charts
          path: dist/
          if-no-files-found: error
      # Publish dist/ as charts.zip on the rolling `charts` tag, so other repos
      # can fetch the latest charts without auth:
      # https://github.com/OcelliQ/ai-models-chart/releases/download/charts/charts.zip
      - name: Publish rolling charts download
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../charts.zip .)
          git tag -f charts
          git push -f origin refs/tags/charts
          notes="Charts built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          if gh release view charts >/dev/null 2>&1; then
            gh release edit charts --notes "$notes"
          else
            gh release create charts --title "Charts" --notes "$notes"
          fi
          gh release upload charts charts.zip --clobber
